<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO Rooms</title><style>body{font-family:system-ui;background:#101625;color:white;margin:0;padding:18px}main{max-width:950px;margin:auto}button,input,select{font:inherit;padding:11px;border-radius:10px;border:0;margin:4px}button{cursor:pointer;background:#f3c842;color:#111;font-weight:700}button:disabled{opacity:.35}input{max-width:170px}.panel{background:#202b40;padding:16px;border-radius:18px;margin:12px 0}.cards{display:flex;flex-wrap:wrap;gap:8px}.card{width:74px;height:112px;border:4px solid white;border-radius:13px;display:grid;place-items:center;font-size:25px;font-weight:900;cursor:pointer;box-sizing:border-box;box-shadow:0 3px 8px #0006}.card.selected{transform:translateY(-13px);outline:4px solid #f3c842}.red{background:#d83d43}.blue{background:#347fe3}.green{background:#20965b}.yellow{background:#d5a91d}.wild{background:#27272c}.muted{color:#c6cfde}.pill{display:inline-block;background:#35435d;border-radius:20px;padding:8px 12px;margin:4px}.active{outline:2px solid #f3c842}#game{display:none}#status{color:#ffdb78}h1{font-size:32px}</style></head><body><main><h1>🃏 UNO Rooms</h1><div id="lobby" class="panel"><input id="name" placeholder="Your name" maxlength="20"><button onclick="send({type:'create',name:nameEl.value})">Create room</button><input id="code" placeholder="Room code" maxlength="5"><button onclick="send({type:'join',name:nameEl.value,code:code.value})">Join room</button></div><div id="game"><div class="panel"><h2>Room <span id="room"></span> <button onclick="navigator.clipboard.writeText(location.origin+'/?room='+room.textContent)">Copy invite link</button></h2><div id="players"></div><button id="start" onclick="send({type:'start'})">Start game</button></div><div class="panel"><div id="status"></div><p id="timer"></p><div id="pile"></div><p id="stack"></p></div><div class="panel"><h2>Your cards <span id="count"></span></h2><div class="cards" id="hand"></div><p><label>Wild colour <select id="color"><option value="red">Red</option><option value="blue">Blue</option><option value="green">Green</option><option value="yellow">Yellow</option></select></label></p><button onclick="play()">Play selected</button><button onclick="send({type:'draw'})" id="draw">Draw / Accept stack</button><button onclick="send({type:'keep'})" id="keep">Keep drawn card</button><button onclick="send({type:'uno'})">UNO!</button></div><div class="panel"><h3>Game log</h3><div id="log"></div></div></div><p id="error"></p></main><script>const nameEl=document.getElementById('name');const code=document.getElementById('code');code.value=new URLSearchParams(location.search).get('room')||'';const socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);let s={},selected=[];function send(o){if(socket.readyState===1)socket.send(JSON.stringify(o));else alert('Connecting. Try again.')}function el(id){return document.getElementById(id)}function card(c){return `<div class="card ${c.color}" style="pointer-events:none">${c.value.toUpperCase()}</div>`}function play(){send({type:'play',ids:selected,color:el('color').value});selected=[]}socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){el('error').textContent=m.message;setTimeout(()=>el('error').textContent='',4500);return}if(m.type!=='state')return;s=m;selected=[];el('lobby').style.display='none';el('game').style.display='block';el('room').textContent=m.room;el('start').style.display=!m.started&&m.players[0]?.id===m.you?'inline':'none';el('players').innerHTML=m.players.map(p=>`<span class="pill ${m.turn===p.id&&m.started?'active':''}">${p.name}: ${p.count} cards ${p.uno?'📣':''} ${p.count===1&&!p.uno&&p.id!==m.you?`<button onclick="send({type:'catch',target:'${p.id}'})">Catch UNO</button>`:''}</span>`).join('');el('status').textContent=m.winner?`${m.players.find(p=>p.id===m.winner)?.name} wins!`:!m.started?'Waiting for host to start':m.turn===m.you?'YOUR TURN':`${m.players.find(p=>p.id===m.turn)?.name}'s turn`;el('pile').innerHTML=m.top?card(m.top):'';el('stack').textContent=m.stack?`Stack penalty: +${m.stack} (${m.stack===2?'+2':m.top.value} only)`:`Current colour: ${m.color||''}`;el('count').textContent=`(${m.hand.length})`;el('hand').innerHTML='';m.hand.forEach(c=>{let d=document.createElement('div');d.className='card '+c.color;d.textContent=c.value.toUpperCase();d.onclick=()=>{if(selected.includes(c.id)){selected=selected.filter(x=>x!==c.id);d.classList.remove('selected')}else{selected.push(c.id);d.classList.add('selected')}};el('hand').append(d)});el('draw').disabled=m.turn!==m.you||!m.started;el('keep').disabled=!m.drawn;el('log').innerHTML=m.log.map(x=>`<p>${x.replaceAll('<','&lt;')}</p>`).join('')};setInterval(()=>{if(s.deadline&&s.started&&!s.winner)el('timer').textContent=`Turn ends in ${Math.max(0,Math.ceil((s.deadline-Date.now())/1000))} seconds`},250);</script></body></html>
